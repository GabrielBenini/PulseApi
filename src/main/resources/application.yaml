spring:
  application:
    name: Pulse-Api

  datasource:
    url: jdbc:h2:mem:pulsedb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2
      settings:
        web-allow-others: true

server:
  port: 8080
  error:
    include-message: always